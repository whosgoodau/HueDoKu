<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HueDoKu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171f;
    --ink-2:#1c212c;
    --ink-3:#252b38;
    --paper:#f3eee0;
    --paper-2:#eae3d0;
    --line:#d9d0b8;
    --line-strong:#3a3226;
    --ivory:#fbf8f1;
    --muted:#8f8a7a;
    --muted-2:#6b7280;
    --gold:#c9a227;
    --teal:#5fa8a0;
    --brick:#c1443c;

    --c1:#c1443c;
    --c2:#dd8a2e;
    --c3:#e4c145;
    --c4:#6f9e5b;
    --c5:#3f83b0;
    --c6:#6a5a8c;
    --c7:#c85f9e;
    --c8:#55606f;
    --c9:#9c714a;

    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, #232a3a 0%, transparent 60%),
      radial-gradient(ellipse 900px 600px at 110% 10%, #1a2a2a 0%, transparent 55%),
      var(--ink);
    color:var(--ivory);
    font-family:var(--font-body);
    display:flex;
    justify-content:center;
    padding:28px 16px 48px;
  }

  .app{
    width:100%;
    max-width:560px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  /* ---------- header ---------- */
  .topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .brand .eyebrow{
    display:block;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.18em;
    color:var(--teal);
    margin-bottom:6px;
    font-weight:700;
  }
  .brand h1{
    margin:0;
    font-family:var(--font-display);
    font-size:34px;
    font-weight:600;
    letter-spacing:.01em;
    line-height:1;
  }
  .brand h1.logo{line-height:0;}
  .brand h1.logo img{display:block; height:72px; width:auto; border-radius:16px;}
  @media (max-width:520px){ .brand h1.logo img{height:52px;} }
  .brand h1 em{
    font-style:italic;
    font-weight:500;
    background:linear-gradient(90deg, var(--c1), var(--c5) 45%, var(--c4) 75%, var(--c3));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .topbar-controls{
    display:flex;
    align-items:center;
    gap:8px;
  }

  select, button{
    font-family:var(--font-body);
    font-size:13px;
  }

  #difficulty{
    appearance:none;
    background:var(--ink-2);
    color:var(--ivory);
    border:1px solid #333c4d;
    border-radius:8px;
    padding:9px 30px 9px 12px;
    font-weight:600;
    cursor:pointer;
    background-image:linear-gradient(45deg, transparent 50%, var(--muted-2) 50%), linear-gradient(135deg, var(--muted-2) 50%, transparent 50%);
    background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
    background-size:5px 5px, 5px 5px;
    background-repeat:no-repeat;
  }
  #difficulty:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

  .btn{
    background:var(--ink-2);
    color:var(--ivory);
    border:1px solid #333c4d;
    border-radius:8px;
    padding:9px 14px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease, border-color .15s ease;
  }
  .btn:hover{background:var(--ink-3); border-color:#454f63;}
  .btn:active{transform:scale(.97);}
  .btn:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}
  .btn.primary{
    background:var(--teal);
    color:#0d2320;
    border-color:var(--teal);
  }
  .btn.primary:hover{background:#6fb8b0;}

  /* ---------- status row ---------- */
  .status-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--ink-2);
    border:1px solid #2a3040;
    border-radius:12px;
    padding:10px 14px;
    flex-wrap:wrap;
  }
  .status-item{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--muted-2);
  }
  .status-item .value{
    color:var(--ivory);
    font-weight:700;
  }
  .status-item .value.mistake-warn{color:var(--brick);}

  .mode-switch{
    flex-wrap:wrap; justify-content:center;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .mode-label{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:.05em;
    color:var(--muted-2);
    transition:color .2s ease;
  }
  .mode-label.active{color:var(--ivory);}

  .switch{
    position:relative;
    width:46px;
    height:26px;
    border-radius:999px;
    background:var(--ink);
    border:1px solid #333c4d;
    cursor:pointer;
    flex:none;
  }
  .switch .knob{
    position:absolute;
    top:2px;
    left:2px;
    width:20px;
    height:20px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--c1), var(--c5), var(--c4));
    transition:left .25s cubic-bezier(.5,0,.2,1);
    box-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  .switch[aria-checked="true"] .knob{left:22px;}
  .switch:focus-visible{outline:2px solid var(--teal); outline-offset:3px;}

  /* ---------- board ---------- */
  .board-wrap{
    display:flex;
    justify-content:center;
  }
  .board{
    --d:0ms;
    width:min(94vw, 480px);
    aspect-ratio:1;
    display:grid;
    grid-template-columns:repeat(9,1fr);
    grid-template-rows:repeat(9,1fr);
    background:var(--paper);
    border:3px solid var(--line-strong);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 20px 40px -20px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.02);
    animation:board-in .5s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes board-in{
    from{opacity:0; transform:scale(.97) translateY(6px);}
    to{opacity:1; transform:none;}
  }

  .cell{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--line);
    background:var(--paper);
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .cell.border-r{border-right:2px solid var(--line-strong);}
  .cell.border-b{border-bottom:2px solid var(--line-strong);}
  .cell:focus-visible{outline:2px solid var(--teal); outline-offset:-2px; z-index:5;}

  .cell-bg{
    position:absolute;
    inset:9%;
    border-radius:6px;
    background-color:var(--swatch, transparent);
    opacity:0;
    transition:opacity .35s ease, background-color .2s ease, transform .2s ease;
    transition-delay:var(--d);
  }
  .cell .value{
    position:relative;
    z-index:2;
    font-family:var(--font-mono);
    font-size:clamp(14px,4vw,20px);
    font-weight:600;
    color:var(--ink);
    opacity:1;
    transform:scale(1);
    transition:opacity .3s ease, transform .3s ease, color .15s ease;
    transition-delay:var(--d);
  }

  .board[data-mode="color"] .cell-bg{opacity:1; transform:scale(1);}
  .board[data-mode="color"] .cell .value{opacity:0; transform:scale(.5);}
  .board[data-mode="color"] .cell.given .value{opacity:0;}

  /* both on: the colour tile with its number on top */
  .board[data-mode="both"] .cell-bg{opacity:1; transform:scale(1);}
  .board[data-mode="both"] .cell.given .cell-bg{opacity:1;}
  .board[data-mode="both"] .cell.given .cell-bg::after{content:''; position:absolute; inset:0; border-radius:6px; box-shadow:inset 0 0 0 2px rgba(0,0,0,.35);}
  .board[data-mode="both"] .cell .value, .board[data-mode="both"] .cell.given .value, .board[data-mode="both"] .cell.conflict .value{color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.65);}
  .board[data-mode="both"] .cell.conflict .cell-bg{box-shadow:inset 0 0 0 3px rgba(255,120,105,.95), 0 0 14px rgba(255,90,70,.6);}
  .palette[data-mode="both"] .pal-swatch{opacity:1;}
  .palette[data-mode="both"] .pal-num{position:relative; z-index:2; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.65);}
  .cell.given .value{color:var(--line-strong); font-weight:700;}
  .cell.given{background:var(--paper-2);}
  .cell.given .cell-bg{opacity: var(--given-op, 0);}
  .board[data-mode="color"] .cell.given .cell-bg{opacity:1;}
  .board[data-mode="color"] .cell.given .cell-bg::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius:6px;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.35);
  }

  .cell.peer{background:#e9e2cd;}
  .cell.given.peer{background:#e2dabf;}
  .cell.selected{background:#d7e8e6;}
  .cell.given.selected{background:#cbdfdc;}
  .cell.same-value:not(.selected){box-shadow:inset 0 0 0 2px rgba(95,168,160,.55);}
  .cell.conflict .value{color:var(--brick);}
  .cell.conflict.selected, .cell.conflict.peer{background:#f1d3cf;}
  .cell.conflict .cell-bg{box-shadow:inset 0 0 0 3px rgba(193,68,60,.85);}

  /* ---------- palette ---------- */
  .palette{
    display:grid;
    grid-template-columns:repeat(9, 1fr) auto;
    gap:8px;
  }
  .pal-btn{
    position:relative;
    aspect-ratio:1;
    border-radius:10px;
    border:1px solid #333c4d;
    background:var(--ink-2);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    transition:transform .1s ease, border-color .15s ease, background .15s ease;
  }
  .pal-btn:hover{border-color:#4a5570; transform:translateY(-1px);}
  .pal-btn:active{transform:scale(.94);}
  .pal-btn:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}
  .pal-btn.depleted{opacity:.28; pointer-events:none;}
  .pal-btn.pal-selected{border-color:var(--teal); box-shadow:0 0 0 1px var(--teal);}

  .pal-num{
    font-family:var(--font-mono);
    font-size:16px;
    font-weight:700;
    color:var(--ivory);
    transition:opacity .3s ease;
  }
  .pal-swatch{
    position:absolute;
    inset:0;
    background:var(--swatch);
    opacity:0;
    transition:opacity .3s ease;
  }
  .pal-corner{
    position:absolute;
    top:3px;
    left:5px;
    font-family:var(--font-mono);
    font-size:9px;
    font-weight:700;
    color:rgba(255,255,255,.75);
    z-index:2;
    opacity:0;
    transition:opacity .3s ease;
  }
  .palette[data-mode="color"] .pal-swatch{opacity:1;}
  .palette[data-mode="color"] .pal-num{opacity:0;}
  .palette[data-mode="color"] .pal-corner{opacity:1;}

  .pal-erase{
    aspect-ratio:1;
    border-radius:10px;
    border:1px solid #333c4d;
    background:var(--ink-2);
    color:var(--muted-2);
    cursor:pointer;
    font-size:16px;
    transition:transform .1s ease, border-color .15s ease, color .15s ease;
  }
  .pal-erase:hover{color:var(--ivory); border-color:#4a5570;}
  .pal-erase:active{transform:scale(.94);}
  .pal-erase:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

  /* ---------- message ---------- */
  .message{
    min-height:20px;
    text-align:center;
    font-family:var(--font-mono);
    font-size:13.5px;
    color:var(--gold);
    opacity:0;
    transform:translateY(-4px);
    transition:opacity .3s ease, transform .3s ease;
  }
  .message.show{opacity:1; transform:none;}

  .hint{
    text-align:center;
    font-size:12px;
    color:var(--muted-2);
    font-family:var(--font-body);
  }
  .hint kbd{
    font-family:var(--font-mono);
    background:var(--ink-2);
    border:1px solid #333c4d;
    border-radius:4px;
    padding:1px 5px;
    font-size:11px;
  }

  @media (max-width:420px){
    .brand h1{font-size:27px;}
    .status-row{font-size:12px; padding:8px 10px;}
    .palette{gap:6px;}
  }

  /* =====================================================================
     GX layer: a 3D board with glass tiles. Pure CSS, no libraries.
     ===================================================================== */

  /* coloured light behind the glass, so the glass has something to refract */
  body::before{
    content:''; position:fixed; inset:-10%; z-index:-1; pointer-events:none;
    background:
      radial-gradient(260px 260px at 12% 18%, rgba(193,68,60,.42), transparent 70%),
      radial-gradient(300px 300px at 88% 14%, rgba(63,131,176,.45), transparent 70%),
      radial-gradient(280px 280px at 82% 82%, rgba(111,158,91,.36), transparent 70%),
      radial-gradient(260px 260px at 14% 86%, rgba(200,95,158,.34), transparent 70%),
      radial-gradient(240px 240px at 50% 48%, rgba(228,193,69,.16), transparent 70%);
    filter:blur(28px);
    animation:gx-drift 26s ease-in-out infinite alternate;
  }
  @keyframes gx-drift{ to{ transform:translate3d(2%,-2%,0) scale(1.07); } }

  .btn, .status-row, .pal-btn, .pal-erase, #difficulty, .chip{
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  .btn, #difficulty, .chip{
    background:linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 4px 10px rgba(0,0,0,.3);
  }
  .btn:hover, .chip:hover{background:linear-gradient(160deg, rgba(255,255,255,.22), rgba(255,255,255,.08));}
  .btn.primary{
    background:linear-gradient(160deg, rgba(120,214,203,.95), rgba(60,140,132,.92));
    color:#06201d; border-color:rgba(255,255,255,.35);
  }
  .btn.primary:hover{background:linear-gradient(160deg, rgba(140,230,219,1), rgba(70,155,147,.95));}
  .status-row{
    background:linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.14);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
  }

  /* player / puzzle chips */
  .meta-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .chip{
    font-family:var(--font-mono); font-size:12px; color:var(--ivory);
    border-radius:999px; padding:6px 12px; cursor:pointer;
  }
  .chip:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}
  .chip.grow{margin-left:auto;}

  /* the board: a glass slab with thickness, tilted back, following the pointer a little */
  .board-wrap{perspective:1200px; perspective-origin:50% 28%; padding:6px 0 30px;}
  .board{
    --tx:24deg; --ty:0deg;
    position:relative; overflow:visible;
    padding:9px; gap:3px;
    background:linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.22); border-radius:20px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 40px 50px -30px rgba(0,0,0,.85);
    transform-style:preserve-3d;
    transform:rotateX(var(--tx)) rotateY(var(--ty));
    transition:transform .22s ease-out;
    animation:gx-board-in .7s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes gx-board-in{ from{opacity:0;} to{opacity:1;} }
  /* two plates behind the glass fake the slab's thickness */
  .board::before, .board::after{
    content:''; position:absolute; inset:0; border-radius:20px; pointer-events:none;
  }
  .board::before{
    background:linear-gradient(#141b2b, #080b12);
    transform:translateZ(-30px);
    box-shadow:0 44px 50px -10px rgba(0,0,0,.7);
  }
  .board::after{
    background:linear-gradient(#1d2740, #0d1220);
    transform:translateZ(-15px);
  }

  /* each cell is a raised glass tile; alternating 3x3 boxes stand a little higher */
  .cell{
    border:none; border-radius:9px; background:linear-gradient(145deg, rgba(255,255,255,.17), rgba(255,255,255,.05));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4), inset 0 -2px 3px rgba(0,0,0,.35), 0 3px 6px rgba(0,0,0,.35);
    transform:translateZ(4px); transform-style:preserve-3d;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .cell.boxa{transform:translateZ(9px); background:linear-gradient(145deg, rgba(255,255,255,.22), rgba(255,255,255,.07));}
  .cell.border-r, .cell.border-b{border:none;}
  .cell:hover{transform:translateZ(15px);}
  .cell .value{color:var(--ivory); text-shadow:0 1px 2px rgba(0,0,0,.55);}
  .cell.given{background:linear-gradient(145deg, rgba(255,255,255,.3), rgba(255,255,255,.1));}
  .cell.given .value{color:#ffe08a; font-weight:700;}
  .cell.peer, .cell.given.peer{background:linear-gradient(145deg, rgba(95,168,160,.34), rgba(95,168,160,.1));}
  .cell.selected, .cell.given.selected{
    transform:translateZ(26px) scale(1.06); z-index:4;
    background:linear-gradient(145deg, rgba(120,214,203,.7), rgba(60,140,132,.3));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 0 0 2px rgba(150,235,224,.95), 0 16px 24px rgba(0,0,0,.5), 0 0 26px rgba(95,168,160,.55);
  }
  .cell.same-value:not(.selected){box-shadow:inset 0 0 0 2px rgba(150,235,224,.7), 0 3px 6px rgba(0,0,0,.35);}
  .cell.conflict .value{color:#ff8a7d;}
  .cell.conflict.selected, .cell.conflict.peer{background:linear-gradient(145deg, rgba(193,68,60,.6), rgba(193,68,60,.2));}

  /* colour mode: each digit becomes a gem of tinted glass with a highlight on top */
  .cell:not(.filled) .cell-bg{display:none;}
  .cell-bg, .pal-swatch{
    background:linear-gradient(145deg,
      color-mix(in srgb, var(--swatch) 55%, #fff) 0%,
      var(--swatch) 40%,
      color-mix(in srgb, var(--swatch) 68%, #000) 100%);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.75), inset 0 -3px 6px rgba(0,0,0,.35),
               0 0 14px color-mix(in srgb, var(--swatch) 50%, transparent);
  }
  .cell-bg{inset:7%; border-radius:8px;}
  .cell-bg::before, .pal-swatch::before{
    content:''; position:absolute; left:8%; right:8%; top:5%; height:40%;
    border-radius:7px 7px 18px 18px;
    background:linear-gradient(rgba(255,255,255,.62), rgba(255,255,255,.04));
    pointer-events:none;
  }
  .board[data-mode="color"] .cell.conflict .cell-bg{box-shadow:inset 0 0 0 3px rgba(255,120,105,.95), 0 0 14px rgba(255,90,70,.6);}

  /* palette buttons: glass keys */
  .pal-btn, .pal-erase{
    background:linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 5px rgba(0,0,0,.3), 0 5px 10px rgba(0,0,0,.35);
  }
  .pal-btn:hover{transform:translateY(-3px); border-color:rgba(255,255,255,.4);}
  .pal-btn:active, .pal-erase:active{transform:translateY(1px) scale(.96);}
  .pal-btn.pal-selected{border-color:#9ae9df; box-shadow:0 0 0 1px #9ae9df, 0 0 18px rgba(95,168,160,.6), inset 0 1px 0 rgba(255,255,255,.4);}

  /* player / archive window */
  dialog{
    width:min(94vw, 520px); max-height:86vh; overflow:auto;
    background:linear-gradient(160deg, rgba(34,42,62,.96), rgba(16,20,31,.97));
    color:var(--ivory); border:1px solid rgba(255,255,255,.2); border-radius:16px; padding:18px 18px 16px;
    box-shadow:0 30px 80px rgba(0,0,0,.7);
  }
  dialog::backdrop{background:rgba(5,8,14,.6); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);}
  dialog h2{margin:0; font-family:var(--font-display); font-size:22px;}
  dialog h3{margin:18px 0 8px; font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; color:var(--teal);}
  .dlg-head{display:flex; align-items:center; justify-content:space-between; margin:0;}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0;}
  .row input[type=text]{
    flex:1; min-width:120px; background:rgba(0,0,0,.3); color:var(--ivory);
    border:1px solid rgba(255,255,255,.2); border-radius:8px; padding:8px 10px; font:inherit; font-size:13px;
  }
  .pill{font-family:var(--font-mono); font-size:12px; padding:6px 12px; border-radius:999px; cursor:pointer;
    color:var(--ivory); background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);}
  .pill.on{background:rgba(95,168,160,.45); border-color:#9ae9df;}
  table.arch{width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:12px;}

  .note{font-size:12px; color:var(--muted-2); margin:6px 0 0; line-height:1.45;}

  @media (prefers-reduced-motion:reduce){
    body::before, .board{animation:none;}
    .board, .cell{transition:none;}
  }

  .wg-mark{display:inline-block; vertical-align:-4px; margin-left:8px; opacity:.55; transition:opacity .2s;}
  .wg-mark:hover{opacity:1;}
  .wg-foot{text-align:center; font-size:11px; color:var(--muted-2); font-family:var(--font-mono); letter-spacing:.06em;}

<script>
(function(){
  "use strict";

  const ALLMASK = 0b1111111110; // bits 1..9
  const DIFFICULTY = { easy: 44, medium: 34, hard: 28 };

  // The puzzle maker draws every random choice from rng(). Normally that is Math.random; to rebuild a puzzle from
  // its ID it is swapped for a generator that starts from the ID's seed (mulberry32), so the same seed always gives the same puzzle.
  let rng = Math.random;
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a>>>15, 1 | a);
      t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
      return ((t ^ t>>>14) >>> 0) / 4294967296;
    };
  }

  function boxOf(r,c){ return Math.floor(r/3)*3 + Math.floor(c/3); }
  function popcount(x){ let c=0; while(x){ x&=x-1; c++; } return c; }
  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(rng()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  // ---------- sudoku engine ----------
  function generateFull(){
    const board = new Array(81).fill(0);
    const rows = new Array(9).fill(0), cols = new Array(9).fill(0), boxes = new Array(9).fill(0);

    function fill(pos){
      if(pos === 81) return true;
      const r = Math.floor(pos/9), c = pos%9, b = boxOf(r,c);
      const cand = ALLMASK & ~(rows[r]|cols[c]|boxes[b]);
      const digits = [];
      for(let d=1; d<=9; d++) if(cand & (1<<d)) digits.push(d);
      shuffle(digits);
      for(const d of digits){
        board[pos]=d;
        rows[r]|=1<<d; cols[c]|=1<<d; boxes[b]|=1<<d;
        if(fill(pos+1)) return true;
        board[pos]=0;
        rows[r]&=~(1<<d); cols[c]&=~(1<<d); boxes[b]&=~(1<<d);
      }
      return false;
    }
    fill(0);
    return board;
  }

  function countSolutions(board, limit, onSolution){
    const rows = new Array(9).fill(0), cols = new Array(9).fill(0), boxes = new Array(9).fill(0);
    for(let i=0;i<81;i++){
      const v = board[i];
      if(v){
        const r = Math.floor(i/9), c = i%9, b = boxOf(r,c);
        rows[r]|=1<<v; cols[c]|=1<<v; boxes[b]|=1<<v;
      }
    }
    const work = board.slice();
    let count = 0;

    function solve(){
      if(count >= limit) return;
      let bestPos=-1, bestCand=0, bestCount=10;
      for(let i=0;i<81;i++){
        if(work[i]===0){
          const r = Math.floor(i/9), c = i%9, b = boxOf(r,c);
          const cand = ALLMASK & ~(rows[r]|cols[c]|boxes[b]);
          const pc = popcount(cand);
          if(pc===0) return;
          if(pc<bestCount){ bestCount=pc; bestPos=i; bestCand=cand; if(pc===1) break; }
        }
      }
      if(bestPos===-1){ count++; if(onSolution) onSolution(work); return; }
      const r = Math.floor(bestPos/9), c = bestPos%9, b = boxOf(r,c);
      for(let d=1; d<=9; d++){
        if(bestCand & (1<<d)){
          work[bestPos]=d; rows[r]|=1<<d; cols[c]|=1<<d; boxes[b]|=1<<d;
          solve();
          work[bestPos]=0; rows[r]&=~(1<<d); cols[c]&=~(1<<d); boxes[b]&=~(1<<d);
          if(count>=limit) return;
        }
      }
    }
    solve();
    return count;
  }

  function makePuzzle(full, targetClues){
    const puzzle = full.slice();
    const order = shuffle([...Array(81).keys()]);
    let clues = 81;
    for(const pos of order){
      if(clues <= targetClues) break;
      const backup = puzzle[pos];
      if(backup===0) continue;
      puzzle[pos] = 0;
      const cnt = countSolutions(puzzle, 2);
      if(cnt===1){ clues--; } else { puzzle[pos]=backup; }
    }
    return puzzle;
  }

  // ---------- game state ----------
  let solution=[], puzzle=[], board=[], givenMask=[];
  let selected=null, mode='number', mistakes=0, seconds=0, solved=false, timerHandle=null;

  const boardEl = document.getElementById('board');
  const paletteEl = document.getElementById('palette');
  const timerValEl = document.getElementById('timerVal');
  const mistakeValEl = document.getElementById('mistakeVal');
  const messageEl = document.getElementById('message');

  const colToggle = document.getElementById('colToggle');

  const cellEls = [];

  function buildBoardDOM(){

      el.addEventListener('focus', ()=> selectCell(i));

  }

  function buildPaletteDOM(){
    paletteEl.innerHTML = '';
    for(let d=1; d<=9; d++){
      const btn = document.createElement('button');
      btn.className = 'pal-btn';
      btn.dataset.v = d;

  function computeConflicts(){
    const conflicts = new Set();
    function scanGroup(indices){
      const seen = {};
      for(const i of indices){
        const v = board[i];
        if(!v) continue;
        (seen[v] = seen[v]||[]).push(i);
      }
      for(const v in seen){
        if(seen[v].length>1) seen[v].forEach(i=>conflicts.add(i));
      }
    }
    for(let r=0;r<9;r++){
      const rowIdx=[], colIdx=[], boxIdx=[];
      for(let k=0;k<9;k++){
        rowIdx.push(r*9+k);
        colIdx.push(k*9+r);
      }
      const br = Math.floor(r/3)*3, bc = (r%3)*3;
      for(let a=0;a<3;a++) for(let bcol=0;bcol<3;bcol++) boxIdx.push((br+a)*9 + (bc+bcol));
      scanGroup(rowIdx); scanGroup(colIdx); scanGroup(boxIdx);
    }
    return conflicts;
  }

  function peersOf(i){
    const r = Math.floor(i/9), c = i%9, b = boxOf(r,c);
    const peers = new Set();
    for(let k=0;k<9;k++){
      peers.add(r*9+k);
      peers.add(k*9+c);
    }
    const br = Math.floor(b/3)*3, bc = (b%3)*3;
    for(let a=0;a<3;a++) for(let bb=0;bb<3;bb++) peers.add((br+a)*9+(bc+bb));
    peers.delete(i);
    return peers;
  }

  function renderBoard(){
    const conflicts = computeConflicts();
    const peers = selected!==null ? peersOf(selected) : new Set();
    const selVal = selected!==null ? board[selected] : 0;

    for(let i=0;i<81;i++){
      const {el, bg, val} = cellEls[i];
      const v = board[i];
      el.classList.toggle('given', givenMask[i]);
      el.classList.toggle('filled', v!==0);
      el.classList.toggle('selected', i===selected);
      el.classList.toggle('peer', peers.has(i) && i!==selected);
      el.classList.toggle('conflict', conflicts.has(i));
      el.classList.toggle('same-value', v!==0 && v===selVal && i!==selected);
      val.textContent = v ? v : '';
      bg.style.setProperty('--swatch', v ? `var(--c${v})` : 'transparent');
    }
    renderPalette();
  }

  function renderPalette(){
    const counts = new Array(10).fill(0);
    board.forEach(v=>{ if(v) counts[v]++; });
    const selVal = selected!==null ? board[selected] : 0;
    const buttons = paletteEl.querySelectorAll('.pal-btn');
    buttons.forEach(btn=>{
      const d = Number(btn.dataset.v);
      btn.classList.toggle('depleted', counts[d]>=9);
      btn.classList.toggle('pal-selected', d===selVal && selVal!==0);
    });
  }

  function selectCell(i){
    if(solved) return;
    selected = i;
    cellEls[i].el.focus({preventScroll:true});
    renderBoard();
  }

  function placeValue(v){
    if(solved || selected===null) return;
    if(givenMask[selected]) return;
    board[selected] = v;
    if(v!==0){
      const nowConflict = computeConflicts().has(selected);
      if(nowConflict) mistakes++;
    }
    updateMistakesUI();
    renderBoard();
    checkWin();
    saveState();
  }

  function checkWin(){
    if(board.every(v=>v!==0) && computeConflicts().size===0){
      solved = true;
      stopTimer();
      const rank = recordWin();
      showMessage(`Solved in ${formatTime(seconds)} · ${mistakes} mistake${mistakes===1?'':'s'}` + (rank ? ` · #${rank.place} of ${rank.of} on this puzzle` : ''));
    }
  }

  function showMessage(text){
    messageEl.textContent = text;
    messageEl.classList.add('show');
  }
  function clearMessage(){
    messageEl.textContent = '';
    messageEl.classList.remove('show');
  }

  function updateMistakesUI(){
    mistakeValEl.textContent = mistakes;
    mistakeValEl.classList.toggle('mistake-warn', mistakes>0);
  }

  function formatTime(s){
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const ss = (s%60).toString().padStart(2,'0');
    return `${m}:${ss}`;
  }
  function updateTimerUI(){ timerValEl.textContent = formatTime(seconds); }
  function startTimer(){
    stopTimer();
    timerHandle = setInterval(()=>{ seconds++; updateTimerUI(); if(seconds%5===0) saveState(); }, 1000);
  }
  function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }

  // ---------- players, puzzle hashes, archive and saved games ----------
  // Everything lives in this browser's localStorage under one key:
  //   users:   { name: { scores: { puzzleId: {plays, solves, best, last} }, current: <saved game> } }
  //   archive: { puzzleId: { p: puzzle (81 digits), s: solution (81 digits), d: level, first: time } }
  // A puzzle's ID is HX- + a level letter (E, M or H) + the 7-character seed it was made from, e.g. HX-M0K3M9Q1.
  // Anyone who types that ID gets the same puzzle, on any device, with no archive needed. Every player's score is
  // filed under the ID. (Before v4 an ID was a one-way hash of the 81 digits, 11 characters after HX-. Those still
  // load, but only in a browser that already holds the puzzle.)
  const KEY = 'chromadoku.gx.v1';
  const BAD_NAMES = ['__proto__','constructor','prototype'];
  const NAME_OK = /^[A-Za-z0-9 ._-]{1,20}$/;
  const LEVELS = ['easy','medium','hard'];
  const MISTAKE_SECONDS = 30; // each mistake adds this to the time when scores are compared
  const playerNameEl = document.getElementById('playerName');
  const pidValEl = document.getElementById('pidVal');
  const dlg = document.getElementById('dlg');
  const dlgTitle = document.getElementById('dlgTitle');
  const dlgBody = document.getElementById('dlgBody');
  let db = loadDB(), user = null, pid = '', storageOK = true;

  function has(o,k){ return typeof k==='string' && Object.prototype.hasOwnProperty.call(o,k); }
  function isDigits81(s){ return typeof s==='string' && /^[0-9]{81}$/.test(s); }
  function validName(n){ return typeof n==='string' && NAME_OK.test(n) && !BAD_NAMES.includes(n); }
  function loadDB(){
    try{
      const raw = JSON.parse(localStorage.getItem(KEY));
      if(raw && typeof raw==='object' && raw.users && raw.archive) return raw;
    }catch(e){}
    return {v:1, users:{}, archive:{}, last:null};
  }
  function saveDB(){
    try{ localStorage.setItem(KEY, JSON.stringify(db)); storageOK = true; }
    catch(e){ storageOK = false; }
  }
  // cyrb53: a small, fast 53-bit string hash. It names puzzles; it is not for security.
  function hashPuzzle(str){
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for(let i=0;i<str.length;i++){
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
    h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
    const n = 4294967296 * (2097151 & h2) + (h1>>>0);
    return 'HX-' + n.toString(36).toUpperCase().padStart(11,'0');
  }
  const LEVEL_LETTER = { easy:'E', medium:'M', hard:'H' };
  const LETTER_LEVEL = { E:'easy', M:'medium', H:'hard' };
  const SEED_ID = /^HX-([EMH])([0-9A-Z]{7})$/;
  function seedId(level, seed){ return 'HX-' + LEVEL_LETTER[level] + seed.toString(36).toUpperCase().padStart(7,'0'); }
  function puzzleFromId(id){ // the puzzle an ID stands for, or null when it is not a seed ID
    const m = SEED_ID.exec(id);
    if(!m) return null;
    const seed = parseInt(m[2], 36);
    if(!(seed <= 4294967295)) return null;
    const level = LETTER_LEVEL[m[1]];
    rng = mulberry32(seed);
    try{
      const full = generateFull();
      return { puzzle: makePuzzle(full, DIFFICULTY[level]), solution: full, level };
    } finally { rng = Math.random; }
  }
  function idMatches(id, p){ // does this ID really belong to that puzzle?
    if(SEED_ID.test(id)){ const g = puzzleFromId(id); return !!g && g.puzzle.join('')===p; }
    return hashPuzzle(p)===id;
  }
  function ensureUser(name){
    if(!has(db.users,name)) db.users[name] = {created:Date.now(), scores:{}, current:null};
    return db.users[name];
  }
  function setUser(name){
    user = name;
    db.last = name;
    ensureUser(name);
    playerNameEl.textContent = name;
    saveDB();
  }

  function saveState(){
    if(!user || !pid) return;
    const u = ensureUser(user);
    u.current = solved ? null : {id:pid, b:board.join(''), t:seconds, m:mistakes, mode};
    db.last = user;
    saveDB();
  }

  function standings(id){
    const out = [];
    for(const name of Object.keys(db.users)){
      const r = db.users[name].scores[id];
      if(r && r.best) out.push({name, t:r.best.t, m:r.best.m, adj:r.best.adj});
    }
    return out.sort((a,b)=>a.adj-b.adj);
  }
  function recordWin(){
    const u = ensureUser(user);
    const rec = u.scores[pid] || (u.scores[pid] = {plays:1, solves:0, best:null, last:null});
    const adj = seconds + MISTAKE_SECONDS*mistakes;
    rec.solves++;
    rec.last = {t:seconds, m:mistakes, at:Date.now()};
    if(!rec.best || adj < rec.best.adj) rec.best = {t:seconds, m:mistakes, adj, at:Date.now()};
    u.current = null;
    saveDB();
    const s = standings(pid);
    const i = s.findIndex(x=>x.name===user);
    return i<0 ? null : {place:i+1, of:s.length};
  }

  function startGame(pz, sol, diff, resume, id){
    puzzle = pz.slice();
    solution = sol.slice();
    pid = id || hashPuzzle(puzzle.join(''));
    givenMask = puzzle.map(v=>v!==0);
    board = puzzle.slice();
    selected = null; mistakes = 0; seconds = 0; solved = false;
    if(resume){
      board = resume.b.split('').map((ch,i)=> givenMask[i] ? puzzle[i] : Number(ch));
      seconds = Math.max(0, resume.t|0);
      mistakes = Math.max(0, resume.m|0);
      setMode(resume.mode);
    } else {
      if(!has(db.archive,pid)) db.archive[pid] = {p:puzzle.join(''), s:solution.join(''), d:diff, first:Date.now()};
      const u = ensureUser(user);
      const rec = u.scores[pid] || (u.scores[pid] = {plays:0, solves:0, best:null, last:null});
      rec.plays++;
    }
    difficultySel.value = diff;
    pidValEl.textContent = pid.slice(3);
    updateMistakesUI();
    updateTimerUI();
    clearMessage();
    startTimer();
    renderBoard();
    saveState();
  }
  function newGame(){
    const diff = LEVEL_LETTER[difficultySel.value] ? difficultySel.value : 'medium';
    const seed = (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint32Array(1))[0] : Math.floor(Math.random()*4294967296);
    const id = seedId(diff, seed);
    const g = puzzleFromId(id);
    startGame(g.puzzle, g.solution, diff, null, id);
  }
  function replay(id){
    const a = db.archive[id];
    saveState();
    startGame(a.p.split('').map(Number), a.s.split('').map(Number), a.d, null, id);
  }
  function resumeOrNew(){
    const c = ensureUser(user).current;
    if(c && has(db.archive,c.id) && isDigits81(c.b) && idMatches(c.id, db.archive[c.id].p)){
      const a = db.archive[c.id];
      startGame(a.p.split('').map(Number), a.s.split('').map(Number), a.d, c, c.id);
      showMessage('Welcome back, ' + user + ' · your game is restored');
    } else {
      newGame();
    }
  }
  function switchUser(name){
    saveState();
    setUser(name);
    resumeOrNew();
  }

  // ---------- the window for players and the archive ----------
  function el(tag, props, ...kids){
    const e = document.createElement(tag);
    for(const k in (props||{})){
      if(k==='class') e.className = props[k];
      else if(k==='text') e.textContent = props[k];
      else if(k.startsWith('on')) e.addEventListener(k.slice(2), props[k]);
      else e.setAttribute(k, props[k]);
    }
    kids.forEach(c=>{ if(c) e.append(c); });
    return e;
  }
  function openPlayers(){
    dlgTitle.textContent = 'Players';
    dlgBody.replaceChildren();
    dlgBody.append(el('h3',{text:'WHO IS PLAYING'}));
    const list = el('div',{class:'row'});
    Object.keys(db.users).sort().forEach(n=>{
      list.append(el('button',{class:'pill'+(n===user?' on':''), text:n, onclick:()=>{ dlg.close(); if(n!==user) switchUser(n); }}));
    });
    dlgBody.append(list);
    const input = el('input',{type:'text', maxlength:'20', placeholder:'New player name', 'aria-label':'New player name'});
    const err = el('p',{class:'note'});
    const add = ()=>{
      const n = input.value.trim();
      if(!validName(n)){ err.textContent = 'Use 1–20 letters, numbers, spaces, dot, underscore or dash.'; return; }
      dlg.close();
      if(n!==user) switchUser(n);
    };
    input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } });
    dlgBody.append(el('div',{class:'row'}, input, el('button',{class:'btn primary', text:'Add & play', onclick:add})), err);
    dlgBody.append(el('p',{class:'note', text:'Players are saved in this browser only, and there is no password: it is a scoreboard for people who share a device.'}));
    if(!storageOK) dlgBody.append(el('p',{class:'note', text:'This browser is blocking saving, so progress will be lost when you close the page.'}));

    dlgBody.append(el('h3',{text:'MOVE YOUR DATA'}));
    const file = el('input',{type:'file', accept:'application/json,.json', style:'display:none'});
    const status = el('p',{class:'note'});
    file.addEventListener('change', async ()=>{
      try{
        const added = mergeImport(JSON.parse(await file.files[0].text()));
        status.textContent = 'Imported. ' + added + ' new puzzle' + (added===1?'':'s') + ' added to the archive.';
        renderBoard();
      }catch(e){ status.textContent = 'Could not import that file: ' + e.message; }
    });
    dlgBody.append(el('div',{class:'row'},
      el('button',{class:'btn', text:'Export file', onclick:exportData}),
      el('button',{class:'btn', text:'Import file', onclick:()=>file.click()}), file), status);
    dlg.showModal();
  }
  function exportData(){
    saveState();
    const blob = new Blob([JSON.stringify(db)], {type:'application/json'});
    const a = el('a',{href:URL.createObjectURL(blob), download:'chromadoku-data.json'});
    document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }
  // An imported file is never trusted: names are checked, puzzle IDs are recomputed from the
  // puzzle itself, and numbers must be plain finite numbers.
  function mergeImport(raw){
    if(!raw || typeof raw!=='object' || !raw.users || !raw.archive) throw new Error('this is not a Chromadoku file');
    let added = 0;
    for(const id of Object.keys(raw.archive)){
      const a = raw.archive[id];
      if(!a || !isDigits81(a.p) || !isDigits81(a.s)) continue;
      const realId = (SEED_ID.test(id) && idMatches(id, a.p)) ? id : hashPuzzle(a.p);
      if(!has(db.archive,realId)){
        db.archive[realId] = {p:a.p, s:a.s, d:LEVELS.includes(a.d)?a.d:'medium', first:Number.isFinite(a.first)?a.first:Date.now()};
        added++;
      }
    }
    for(const name of Object.keys(raw.users)){
      const src = raw.users[name];
      if(!validName(name) || !src || typeof src!=='object' || !src.scores || typeof src.scores!=='object') continue;
      const u = ensureUser(name);
      for(const id of Object.keys(src.scores)){
        const r = src.scores[id];
        if(!has(db.archive,id) || !r || typeof r!=='object') continue;
        const mine = u.scores[id] || (u.scores[id] = {plays:0, solves:0, best:null, last:null});
        mine.plays = Math.max(mine.plays, r.plays|0);
        mine.solves = Math.max(mine.solves, r.solves|0);
        const b = r.best;
        if(b && Number.isFinite(b.t) && Number.isFinite(b.m) && b.t>=0 && b.m>=0){
          const adj = b.t + MISTAKE_SECONDS*b.m;
          if(!mine.best || adj < mine.best.adj) mine.best = {t:b.t, m:b.m, adj, at:Number.isFinite(b.at)?b.at:0};
        }
      }
    }
    saveDB();
    return added;
  }
  function openArchive(){
    dlgTitle.textContent = 'Puzzle archive';
    dlgBody.replaceChildren();
    const ids = Object.keys(db.archive).sort((a,b)=>db.archive[b].first-db.archive[a].first).slice(0,100);
    if(!ids.length){ dlgBody.append(el('p',{class:'note', text:'No puzzles yet.'})); dlg.showModal(); return; }
    dlgBody.append(el('p',{class:'note', text:'Every puzzle played in this browser, newest first. Scores compare time plus ' + MISTAKE_SECONDS + ' seconds per mistake.'}));
    const head = el('tr',{}, ...['Puzzle','Level','Plays','Top score','You',''].map(t=>el('th',{text:t})));
    const body = ids.map(id=>{
      const plays = Object.keys(db.users).reduce((n,u)=>n + (db.users[u].scores[id] ? db.users[u].scores[id].plays : 0), 0);
      const top = standings(id)[0];
      const mine = has(db.users,user) && db.users[user].scores[id] && db.users[user].scores[id].best;
      return el('tr',{},
        el('td',{text:id.slice(3,9)}),
        el('td',{text:db.archive[id].d}),
        el('td',{text:String(plays)}),
        el('td',{text: top ? top.name + ' ' + formatTime(top.t) + (top.m ? ' (' + top.m + '✗)' : '') : '—'}),
        el('td',{text: mine ? formatTime(mine.t) + (mine.m ? ' (' + mine.m + '✗)' : '') : '—'}),
        el('td',{}, el('button',{class:'pill', text:'Play', onclick:()=>{ dlg.close(); replay(id); }})));
    });
    dlgBody.append(el('table',{class:'arch'}, el('thead',{},head), el('tbody',{},...body)));
    dlg.showModal();
  }
  document.getElementById('playerBtn').addEventListener('click', openPlayers);
  document.getElementById('archiveBtn').addEventListener('click', openArchive);
  document.getElementById('pidBtn').addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText(pid); showMessage('Puzzle ID ' + pid + ' copied'); }
    catch(e){ showMessage('Puzzle ID ' + pid); }
  });
  // ---------- restart the same puzzle ----------
  // Starts it again from the beginning (clock, mistakes and your numbers reset). It counts as another play of that puzzle.
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    if(!pid) return;
    if(!solved && board.some((v,i)=> v!==puzzle[i]) && !confirm('Restart this puzzle? Your numbers so far are cleared.')) return;
    replay(pid);
    showMessage('Same puzzle, fresh start');
  });

  // ---------- enter a puzzle ----------
  // Type a puzzle ID (e.g. M0K3M9Q1): the puzzle is rebuilt from the ID, so it works on any device.
  // Also accepted: an 81-digit puzzle (0 . or _ for empty cells) from anywhere, and an old v1-v3 ID, which only
  // works if this browser has already played that puzzle (those IDs are one-way hashes).
  function enterPuzzle(text){ // returns an error message, or '' once the puzzle has started
    const t = text.replace(/\s+/g,'').toUpperCase();
    if(!t) return 'Type or paste a puzzle ID first.';
    const code = t.replace(/[._]/g,'0');
    if(isDigits81(code)){
      const pz = code.split('').map(Number);
      for(let i=0;i<81;i++){
        if(!pz[i]) continue;
        for(const j of peersOf(i)) if(j!==i && pz[j]===pz[i]) return 'Two equal numbers sit in the same row, column or box, so this puzzle cannot be solved.';
      }
      let sol = null;
      const n = countSolutions(pz, 2, (w)=>{ if(!sol) sol = w.slice(); });
      if(n===0) return 'This puzzle has no solution.';
      if(n>1) return 'This puzzle has more than one solution; a proper sudoku has exactly one.';
      const clues = pz.filter(Boolean).length;
      dlg.close();
      saveState();
      startGame(pz, sol, clues>=40 ? 'easy' : clues>=31 ? 'medium' : 'hard', null);
      showMessage('Puzzle loaded');
      return '';
    }
    const id = t.startsWith('HX-') ? t : 'HX-' + t;
    if(SEED_ID.test(id)){
      const g = puzzleFromId(id);
      if(!g) return 'That ID is not valid.';
      dlg.close();
      saveState();
      startGame(g.puzzle, g.solution, g.level, null, id);
      showMessage('Puzzle ' + id + ' loaded');
      return '';
    }
    if(/^HX-[0-9A-Z]{11}$/.test(id)){
      if(has(db.archive,id)){ dlg.close(); replay(id); showMessage('Puzzle ' + id + ' loaded from the archive'); return ''; }
      return 'That is an old-style ID (before v4). It only works in a browser that has played the puzzle. Ask for the puzzle\'s new ID, or its 81 digits.';
    }
    return 'That is not a puzzle ID (like M0K3M9Q1) or an 81-digit puzzle.';
  }
  function openEnter(){
    dlgTitle.textContent = 'Enter / share a puzzle';
    dlgBody.replaceChildren();
    dlgBody.append(el('h3',{text:'PLAY A PUZZLE YOU WERE GIVEN'}));
    const input = el('input',{type:'text', placeholder:'Puzzle ID, e.g. M0K3M9Q1', 'aria-label':'Puzzle ID', autocomplete:'off', spellcheck:'false'});
    const err = el('p',{class:'note'});
    const go = ()=>{ err.textContent = enterPuzzle(input.value); };
    input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } });
    dlgBody.append(el('div',{class:'row'}, input, el('button',{class:'btn primary', text:'Play it', onclick:go})), err);

    dlgBody.append(el('h3',{text:'SHARE THE PUZZLE YOU ARE PLAYING'}));
    const short = SEED_ID.test(pid);
    const shareText = short ? pid.slice(3) : puzzle.join('');
    const share = el('input',{type:'text', readonly:'readonly', value:shareText, 'aria-label':'Puzzle ID to share'});
    share.addEventListener('focus', ()=> share.select());
    const copied = el('p',{class:'note', text: short
      ? 'Type this ID into Enter / share on any device and you get exactly this puzzle.'
      : 'This puzzle is from an older version or was typed in, so it has no short ID. Its 81 digits work on any device.'});
    dlgBody.append(el('div',{class:'row'}, share, el('button',{class:'btn', text: short ? 'Copy ID' : 'Copy digits', onclick: async ()=>{
      try{ await navigator.clipboard.writeText(shareText); copied.textContent = 'Copied.'; }
      catch(e){ share.select(); copied.textContent = 'Press Ctrl+C to copy the selected text.'; }
    }})), copied);
    dlg.showModal();
    input.focus();
  }
  document.getElementById('enterBtn').addEventListener('click', openEnter);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveState(); });
  window.addEventListener('pagehide', saveState);

  // mode is 'number' (numbers only), 'color' (colours only) or 'both'. One of the two always stays on.
  function setMode(next){
    mode = (next==='color' || next==='both') ? next : 'number';
    const showNum = mode!=='color', showCol = mode!=='number';
    boardEl.dataset.mode = mode;
    paletteEl.dataset.mode = mode;
    numToggle.setAttribute('aria-checked', String(showNum));
    colToggle.setAttribute('aria-checked', String(showCol));
    labelNumbers.classList.toggle('active', showNum);
    labelColors.classList.toggle('active', showCol);
  }
  function toggleParts(part){
    let n = mode!=='color', c = mode!=='number';
    if(part==='num') n = !n; else c = !c;
    if(!n && !c){ if(part==='num') c = true; else n = true; }
    setMode(n && c ? 'both' : n ? 'number' : 'color');
    saveState();
  }

  // ---------- events ----------
  numToggle.addEventListener('click', ()=> toggleParts('num'));
  colToggle.addEventListener('click', ()=> toggleParts('col'));
  newGameBtn.addEventListener('click', ()=>{ saveState(); newGame(); });
  difficultySel.addEventListener('change', newGame);

  // the board leans a little towards the mouse (not on touch screens, not with reduced motion)
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.addEventListener('pointermove', (e)=>{
      if(e.pointerType!=='mouse') return;
      const x = e.clientX/window.innerWidth - .5, y = e.clientY/window.innerHeight - .5;
      boardEl.style.setProperty('--ty', (x*12).toFixed(2) + 'deg');
      boardEl.style.setProperty('--tx', (24 - y*8).toFixed(2) + 'deg');
    });
  }

  document.addEventListener('keydown', (e)=>{
    if(dlg.open || e.ctrlKey || e.metaKey || e.altKey) return;
    if(e.target && e.target.closest && e.target.closest('input,textarea,select')) return;
    if(e.key.toLowerCase()==='c'){ toggleParts('col'); return; }
    if(e.key.toLowerCase()==='n'){ toggleParts('num'); return; }
    if(selected===null) return;
    if(/^[1-9]$/.test(e.key)){ placeValue(Number(e.key)); return; }
    if(e.key==='Backspace' || e.key==='Delete' || e.key==='0'){ placeValue(0); return; }
    const r = Math.floor(selected/9), c = selected%9;
    if(e.key==='ArrowUp'){ e.preventDefault(); selectCell(Math.max(0,r-1)*9+c); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); selectCell(Math.min(8,r+1)*9+c); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); selectCell(r*9+Math.max(0,c-1)); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); selectCell(r*9+Math.min(8,c+1)); }
  });

  // ---------- init ----------
  buildBoardDOM();
  buildPaletteDOM();
  setMode('number');
  setUser(has(db.users, db.last) ? db.last : 'Guest');
  resumeOrNew();
})();
</script>
</body>
</html>
